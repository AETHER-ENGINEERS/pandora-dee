<html lang="en">

    .empty { margin: auto; color: var(--muted); }

  </style>
</head>

  return { ...line, result: "Verified. Rubric " + score + ". " + line.evidence };
}
function thinkPane(body, files) {
  const note = document.createElement("p"); note.className = "muted"; note.textContent = "A line with no hard check cannot count as verified. A failed file check or rubric is a veto. Code and shell stay on the phone.";
  body.append(note);
  const lines = thinkLines();
  const best = lines.filter((line) => String(line.result || "").startsWith("Verified"))[0];
  const bestEl = document.createElement("p"); bestEl.className = "muted"; bestEl.textContent = best ? "Best verified: " + best.text : "Nothing is verified yet.";
  body.append(bestEl);
  lines.forEach((line) => {
    const card = document.createElement("div"); card.className = "card";
    const title = document.createElement("strong"); title.textContent = line.text;
    const detail = document.createElement("p"); detail.className = "muted"; detail.textContent = line.verifier + (line.result ? " · " + line.result : "");
    card.append(title, detail);
    if (line.verifier === "file") {
      const path = document.createElement("input"); path.placeholder = "path in this seat"; path.value = line.path || "SOUL.md";
      const expect = document.createElement("input"); expect.placeholder = "must contain"; expect.value = line.expect || "";
      path.addEventListener("change", () => { line.path = path.value.slice(0, 80); localStorage.setItem(THINKKEY, JSON.stringify(lines)); });
      expect.addEventListener("change", () => { line.expect = expect.value.slice(0, 80); localStorage.setItem(THINKKEY, JSON.stringify(lines)); });
      card.append(path, expect);
    }
    if (line.verifier === "rubric") {
      const score = document.createElement("input"); score.placeholder = "0 to 1"; score.value = line.score || "";
      const evidence = document.createElement("input"); evidence.placeholder = "evidence"; evidence.value = line.evidence || "";
      score.addEventListener("change", () => { line.score = score.value.slice(0, 8); localStorage.setItem(THINKKEY, JSON.stringify(lines)); });
      evidence.addEventListener("change", () => { line.evidence = evidence.value.slice(0, 160); localStorage.setItem(THINKKEY, JSON.stringify(lines)); });
      card.append(score, evidence);
    }
    card.append(btn("Check", false, () => {
      const next = lines.map((item) => item.id === line.id ? judgeLine(item, files) : item);
      localStorage.setItem(THINKKEY, JSON.stringify(next));
      files["Tot/tree.json"] = JSON.stringify(next.map((item) => ({ id: item.id, text: item.text, verifier: item.verifier, result: item.result })), null, 2) + "\n";
      save(); paint();
    }), btn("Remove", false, () => {
      localStorage.setItem(THINKKEY, JSON.stringify(lines.filter((item) => item.id !== line.id))); paint();
    }));
    body.append(card);
  });
  const form = document.createElement("form"); form.className = "lock";
  const text = document.createElement("input"); text.placeholder = "A line of reasoning";
  const kind = document.createElement("select");
  ["file", "rubric", "none"].forEach((name) => { const o = document.createElement("option"); o.textContent = name; kind.append(o); });
  form.append(text, kind, btn("Add line", false, () => add()));
  form.addEventListener("submit", (e) => { e.preventDefault(); add(); });
  function add() {
    const clean = text.value.trim().slice(0, 240); if (!clean) return;
    const next = [...thinkLines(), { id: "t" + Date.now().toString(36), text: clean, verifier: kind.value, path: "SOUL.md", expect: "", score: "", evidence: "", result: "" }];
    localStorage.setItem(THINKKEY, JSON.stringify(next)); paint();
  }
  body.append(form);
}
const sentryLast = {};
function sentryHit(event, detail, system) {
  const file = sentryFile();
  if (file.enabled !== true || !file.systems || file.systems[system] !== true) return;
  const now = Date.now();
  const hits = [];
  (file.triggers || []).forEach((rule) => {
    if (rule.event !== event) return;
    if (now - (sentryLast[rule.id] || 0) < (rule.cooldown_s || 60) * 1000) return;
    sentryLast[rule.id] = now;
    hits.push(rule.id + " · " + event + " · " + detail);
  });
  if (!hits.length) return;
  const stamp = new Date().toISOString().slice(0, 16).replace("T", " ");
  const block = hits.map((line) => "- " + stamp + " " + line).join("\n");
  if (!FS.jade) FS.jade = { ...(CORE.find((h) => h.id === "jade").files) };
  FS.jade["chronicle.md"] = String(FS.jade["chronicle.md"] || "# Chronicle\n").trimEnd() + "\n" + block + "\n";
  let prev = []; try { prev = JSON.parse(localStorage.getItem(SENTRYLOG) || "[]"); } catch { prev = []; }
  const rows = [block, ...prev].slice(0, 8);
  localStorage.setItem(SENTRYLOG, JSON.stringify(rows));
  save();
  const box = document.getElementById("sentry-log");
  if (box) box.textContent = rows.join("\n\n");
}
function startDeskWatch() {
  window.addEventListener("online", () => sentryHit("network", "online", "network"));
  window.addEventListener("offline", () => sentryHit("network", "offline", "network"));
  document.addEventListener("visibilitychange", () => sentryHit("screen", document.visibilityState, "screen"));
  if (navigator.getBattery) navigator.getBattery().then((cell) => {
    cell.addEventListener("chargingchange", () => sentryHit("charger", cell.charging ? "charging" : "on battery", "battery"));
  }).catch(() => {});
}
startDeskWatch();
addEventListener("resize", paint);
paint();
