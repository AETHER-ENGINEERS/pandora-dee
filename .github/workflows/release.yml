name: Release
# Publish a release on GitHub (Releases → Draft a new release → tag vX.Y.Z → Publish).
# This workflow then builds and attaches: the web page, Jade Link, the Vector bridge kit, checksums,
# and the signed APK when the signing secrets are set (PANDORA_KEYSTORE_B64, PANDORA_KEYSTORE_PASSWORD, PANDORA_KEY_ALIAS).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build assets for
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Signed APK
        env:
          KS_B64: ${{ secrets.PANDORA_KEYSTORE_B64 }}
          PANDORA_KEYSTORE_PASSWORD: ${{ secrets.PANDORA_KEYSTORE_PASSWORD }}
          PANDORA_KEY_ALIAS: ${{ secrets.PANDORA_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::No signing secrets: the APK is not built. Attach a release-signed APK by hand, or add PANDORA_KEYSTORE_B64 / PANDORA_KEYSTORE_PASSWORD / PANDORA_KEY_ALIAS and re-run."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          PANDORA_KEYSTORE="$RUNNER_TEMP/release.jks" bash android/build-apk.sh
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Bridge kit and checksums
        run: |
          V=$(cat VERSION)
          mkdir -p kit/pandora-vector && cp pandora-vector/*.py pandora-vector/*.sh pandora-vector/Dockerfile pandora-vector/docker-compose.yml pandora-vector/.dockerignore pandora-vector/README.md kit/pandora-vector/
          tar -C kit -czf dist/pandora-vector-$V.tar.gz pandora-vector
          mkdir -p kit/pandora-discord && cp pandora-discord/*.py pandora-discord/*.sh pandora-discord/*.txt pandora-discord/Dockerfile pandora-discord/docker-compose.yml pandora-discord/.dockerignore pandora-discord/README.md kit/pandora-discord/
          tar -C kit -czf dist/pandora-discord-$V.tar.gz pandora-discord
          cd dist && sha256sum $(ls *.apk 2>/dev/null) pandora-dee.html jade-link.xdc pandora-vector-$V.tar.gz pandora-discord-$V.tar.gz > SHA256SUMS
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber $(ls dist/*.apk 2>/dev/null) dist/pandora-dee.html dist/jade-link.xdc dist/pandora-vector-*.tar.gz dist/pandora-discord-*.tar.gz dist/SHA256SUMS
