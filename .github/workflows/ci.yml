name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: pip install -r pandora-discord/requirements.txt
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Build web app
        run: npm run build
      - name: Tests
        run: npm test
      - name: Build APK (debug key)
        run: bash android/build-apk.sh
      - name: Bridge checks
        run: |
          python3 -m py_compile pandora-vector/*.py pandora-vector/test/*.py pandora-discord/*.py pandora-discord/test/*.py
          bash -n pandora-vector/setup.sh
          bash -n pandora-discord/setup.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pandora-dee-build
          path: |
            dist/
            tests/.work/**/*.png
          if-no-files-found: ignore

  vector-agent:
    # Compiles Vector's vector-agent with the Jade patch, so a Vector change that breaks the patch shows up here.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: pandora-vector
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
